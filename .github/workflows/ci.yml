# Roda em todo pull request e a cada push na stage e na main.
# Os testes usam um Postgres temporário que existe só durante a execução.
name: Verificações

on:
  push:
    branches: [stage, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verificacoes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Lint, tipos e testes
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: negocio_do_bem
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/negocio_do_bem?schema=public
    steps:
      # Actions presas pelo commit (SHA), e não pela tag, que pode ser movida.
      # O Dependabot atualiza o SHA e o comentário da versão.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
