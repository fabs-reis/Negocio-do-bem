# CodeQL: análise estática do código TypeScript e JavaScript do projeto, em
# busca de falhas como SQL montado com texto do usuário, redirecionamento aberto
# ou XSS. Os alertas aparecem na aba Security > Code scanning e no próprio PR.
#
# Roda em todo pull request, a cada push na stage e na main, e toda segunda
# sobre a stage, para as regras novas do CodeQL alcançarem o código que já existe.
# Não precisa compilar o projeto (build-mode: none).
name: CodeQL

on:
  pull_request:
  push:
    branches: [stage, main]
  schedule:
    # Segunda, 07:00 em São Paulo.
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analisar:
    name: Analisar (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # Para enviar os resultados para a aba Security.
      security-events: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: /language:javascript-typescript
